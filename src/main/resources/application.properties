quarkus.http.port=8081
quarkus.compose.devservices.enabled=false

# Metadados do Swagger ficam em config/OpenApiConfig.
# UI: http://localhost:8081/swagger-ui
# Documento: http://localhost:8081/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.path=/openapi

# PostgreSQL local e o ambiente normal da aplicacao.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/agencia_bancaria}
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.devservices.enabled=false

# Perfil h2, lido por config/H2DatabaseConfig.
# Ative com: mvn quarkus:dev -Dquarkus.profile=h2
%h2.quarkus.datasource.db-kind=h2
%h2.quarkus.datasource.jdbc.url=jdbc:h2:mem:agencia_bancaria;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:db/h2-init.sql'
%h2.quarkus.datasource.username=sa
%h2.quarkus.datasource.password=
%h2.quarkus.datasource.devservices.enabled=false

# Os testes usam H2 e nunca dependem do PostgreSQL local.
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:agencia_bancaria_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:db/h2-init.sql'
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.devservices.enabled=false

# Configuracao BCrypt
security.password.bcrypt-cost=${BCRYPT_COST:12}

# ==================================================
# DESAFIO 32 - AUTENTICACAO JWT
# ==================================================

# Identificacao do emissor
mp.jwt.verify.issuer=agencia-bancaria-quarkus

# Chave publica utilizada para validar tokens
mp.jwt.verify.publickey.location=jwt/publicKey.pem

# Chave privada utilizada para assinar tokens
smallrye.jwt.sign.key.location=jwt/privateKey.pem

# Algoritmo de assinatura
smallrye.jwt.new-token.signature-algorithm=RS256

# Prazo de validade do token em segundos (1 hora)
security.jwt.expiration-seconds=3600

# ==================================================
# FIM DA CONFIGURACAO JWT
# ==================================================
